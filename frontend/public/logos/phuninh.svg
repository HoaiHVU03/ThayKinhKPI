<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="pnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#046A38" />
      <stop offset="100%" stop-color="#0B3B24" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="url(#pnGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Circular Text Path -->
  <path id="textCircle" d="M 28,100 A 72,72 0 1,1 172,100 A 72,72 0 1,1 28,100" fill="none" />
  
  <text font-family="'Inter', 'Roboto', 'Arial', sans-serif" font-size="11.5" font-weight="900" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      TRƯỜNG THPT PHÙ NINH
    </textPath>
  </text>
  
  <text font-family="'Inter', 'Roboto', 'Arial', sans-serif" font-size="10" font-weight="800" fill="#FCD34D" letter-spacing="3">
    <textPath href="#textCircle" startOffset="0%" text-anchor="middle">
      ★ PHÚ THỌ ★
    </textPath>
  </text>

  <!-- Center Shield -->
  <path d="M 64,65 L 136,65 C 136,105 100,132 100,138 C 100,132 64,105 64,65 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Sun Rays inside shield -->
  <path d="M 100,70 L 100,82 M 88,73 L 94,84 M 112,73 L 106,84" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />

  <!-- Torch / Flame -->
  <path d="M 100,73 C 94,80 97,87 100,90 C 103,87 106,80 100,73 Z" fill="#DC2626" />
  <path d="M 100,77 C 98,82 99,86 100,88 C 101,86 102,82 100,77 Z" fill="#FBBF24" />
  <path d="M 97,90 L 103,90 L 101,98 L 99,98 Z" fill="#94A3B8" />

  <!-- Open Book -->
  <path d="M 100,105 C 90,100 78,101 72,104 L 72,118 C 78,115 90,114 100,119 C 110,114 122,115 128,118 L 128,104 C 122,101 110,100 100,105 Z" fill="#FFFFFF" stroke="#046A38" stroke-width="2" />
  <path d="M 100,105 L 100,119" stroke="#046A38" stroke-width="2" />
  
  <!-- Ribbon at Bottom with 1965 -->
  <path d="M 65,142 L 80,137 L 100,143 L 120,137 L 135,142 L 128,154 L 100,149 L 72,154 Z" fill="#B91C1C" stroke="#FCD34D" stroke-width="1.5" />
  <text x="100" y="149" font-family="'Inter', 'Arial', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    EST. 1965
  </text>
</svg>
